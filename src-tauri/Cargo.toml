[package]
name = "social-gravity"
version = "2.0.0-beta"
description = "Social Gravity - Offline Computational Social Psychology Decision Intelligence Workstation"
authors = ["Social Gravity Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = [ "shell-open", "dialog-all", "fs-all" ] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
custom-protocol = ["tauri/custom-protocol"]
