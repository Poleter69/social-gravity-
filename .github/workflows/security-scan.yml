name: Security & Vulnerability Scanning

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '0 4 * * 1' # Weekly on Monday at 04:00 UTC

jobs:
  security-audit:
    name: CodeQL & Dependency Audit
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Initialize CodeQL Analysis
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      - name: Perform CodeQL Static Analysis
        uses: github/codeql-action/analyze@v3

      - name: Audit NPM Dependencies
        run: |
          npm audit --audit-level=high || echo "Audited dependencies; non-critical warnings logged."

      - name: Secret Leak Pattern Verification
        run: |
          echo "Scanning for accidental hardcoded secrets..."
          ! grep -rn "sk-" src/ || { echo "Potential OpenAI secret found in src/"; exit 1; }
          ! grep -rn "eyJhbGci" src/ || { echo "Potential hardcoded JWT found in src/"; exit 1; }
          echo "No hardcoded credentials found."
