name: 🐛 Bug Report
description: Report a reproducible bug in the Social Gravity engine or UI.
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please verify you are running the latest version.
  - type: input
    id: version
    attributes:
      label: Social Gravity Version
      description: What version or commit SHA are you running?
      placeholder: v3.0.0-production
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Deployment Environment
      options:
        - Cloudflare Pages (Production)
        - GitHub Pages (Production)
        - Vercel Free Tier
        - Local Development (npm run dev)
        - Standalone Offline Mode
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: Clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps To Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Open Mission Control
        2. Set Society Archetype to 'Online Community'
        3. Step to Round 10
        4. See error...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Browser / Terminal Console Output
      description: Paste any error messages or stack traces here.
      render: shell
